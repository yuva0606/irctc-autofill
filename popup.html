<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>IRCTC Autofill</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="popup-shell">
        <header class="app-header">
            <p class="eyebrow">IRCTC AUTOFILL</p>
            <h1>Passenger details</h1>
            <p class="header-copy">Choose a saved journey and fill its details when ready.</p>
        </header>

        <button id="startAutofill" class="start-button">
            Autofill selected journey
        </button>

        <section class="section" aria-labelledby="journey-heading">
            <div class="section-heading">
                <h2 id="journey-heading">Journeys</h2>
                <span class="journey-limit">Up to 5</span>
            </div>
            <div id="journeyTabs" class="journey-tabs" role="tablist"
                aria-label="Saved journeys"></div>
            <button id="addJourney" class="add-journey-button">+ New journey</button>
        </section>

        <section class="section" aria-labelledby="passenger-heading">
            <div class="section-heading">
                <h2 id="passenger-heading">Passengers</h2>
            </div>
            <div id="passengers"></div>
            <button id="addPassenger" class="secondary-button">+ Add passenger</button>
        </section>

        <section class="section settings-section" aria-labelledby="settings-heading">
            <h2 id="settings-heading">Booking preferences</h2>

            <label class="field-label" for="paymentMode">Payment type</label>
            <select id="paymentMode">
                <option value="2">BHIM / UPI</option>
                <option value="3">Cards / Net Banking / Wallets / Others</option>
            </select>

            <label class="contact-toggle">
                <input type="checkbox" id="bookOnlyIfConfirmed">
                <span>
                    <strong>Book only if confirmed berths are allotted</strong>
                    <small>IRCTC will enable this booking condition for this journey.</small>
                </span>
            </label>

            <label class="contact-toggle">
                <input type="checkbox" id="preferredCoachEnabled">
                <span>
                    <strong>Specify preferred coach number</strong>
                    <small>Only enabled journeys fill a preferred coach on IRCTC.</small>
                </span>
            </label>

            <div id="preferredCoachContainer" hidden>
                <label class="field-label" for="preferredCoachNumber">Preferred coach number</label>
                <input type="text" id="preferredCoachNumber" maxlength="4"
                    placeholder="Preferred Coach No.">
            </div>

            <label class="contact-toggle">
                <input type="checkbox" id="fillContact">
                <span>
                    <strong>Fill passenger contact number</strong>
                    <small>Only enabled journeys update this field on IRCTC.</small>
                </span>
            </label>

            <div id="contactNumberContainer" hidden>
                <label class="field-label" for="contactNumber">Contact number</label>
                <input type="tel" id="contactNumber" placeholder="10-digit mobile number"
                    inputmode="numeric" maxlength="10">
            </div>
        </section>

        <button id="savePassengers" class="save-button">Save journey</button>
    </main>

    <script src="popup.js"></script>
</body>

</html>
